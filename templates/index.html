<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LaTeX 公式渲染与导出工�?/title>
    <link rel="icon" href="../static/icons/latex-icon-32x32.png" sizes="32x32">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/styles.css">
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/he/1.2.0/he.min.js"></script>
</head>
<body>
    <div class="bg-orb orb-a"></div>
    <div class="bg-orb orb-b"></div>

    <main class="page">
        <header class="hero">
            <p class="hero-kicker">Equation Studio</p>
            <h1>LaTeX 公式渲染与一键导�?/h1>
            <p class="hero-subtitle">左侧专注输入与预览，右侧处理 OCR 与常用公式模板管理�?/p>
        </header>

        <section class="layout-grid">
            <div class="main-column">
                <article class="card">
                    <div class="card-header">
                        <h2>LaTeX 输入</h2>
                        <button id="clear-input-btn" type="button" class="btn btn-ghost">清空</button>
                    </div>
                    <textarea id="latex-input" placeholder="例如：\frac{a^2+b^2}{c^2} = 1"></textarea>
                    <p class="hint">实时渲染，输入后�?300ms 自动刷新�?/p>
                </article>

                <article class="card">
                    <div class="card-header">
                        <h2>预览与导�?/h2>
                        <div class="resolution-wrap">
                            <label for="resolution">DPI</label>
                            <input type="number" id="resolution" value="150" min="72" max="600" step="1">
                        </div>
                    </div>

                    <div id="output" aria-live="polite"></div>

                    <div class="action-grid">
                        <button id="download-svg-btn" type="button" class="btn btn-primary">下载 SVG</button>
                        <button id="download-png-btn" type="button" class="btn btn-primary">下载 PNG</button>
                        <button id="copy-svg-btn" type="button" class="btn btn-secondary">复制 SVG</button>
                        <button id="copy-png-btn" type="button" class="btn btn-secondary">复制 PNG</button>
                    </div>
                </article>
            </div>

            <aside class="side-column">
                <article class="card">
                    <div class="card-header">
                        <h2>图片 OCR �?LaTeX</h2>
                    </div>
                    <form id="uploadForm" class="upload-form">
                        <input type="file" id="fileInput" name="file" accept="image/png, image/jpeg" required>
                        <button type="submit" class="btn btn-primary">上传并识�?/button>
                    </form>
                    <p class="hint">也可以按 <strong>Ctrl + V</strong> 直接粘贴图片识别�?/p>
                    <div id="ocr-result" class="ocr-result"></div>
                </article>

                <article class="card sticky-card">
                    <div class="card-header">
                        <h2>常用公式模板</h2>
                    </div>

                    <form id="preset-form" class="preset-editor" autocomplete="off">
                        <input type="hidden" id="preset-edit-index" value="-1">
                        <input id="preset-name" type="text" placeholder="模板名称（如：定积分�? required>
                        <textarea id="preset-latex" placeholder="模板 LaTeX（如：\int_a^b f(x)dx�? required></textarea>
                        <div class="editor-actions">
                            <button id="preset-save-btn" type="submit" class="btn btn-primary">新增模板</button>
                            <button id="preset-cancel-btn" type="button" class="btn btn-ghost hidden">取消编辑</button>
                        </div>
                    </form>

                    <div id="preset-buttons" class="preset-buttons"></div>
                </article>
            </aside>
        </section>
    </main>

    <div id="notification" role="status" aria-live="polite"></div>
    <div class="watermark">Latex OCR by SimpleTex · Jason Lee · Sep 2024</div>

    <script src="/static/script.js"></script>
</body>
</html>
